name: Generate Keystore
on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (remember this!)'
        required: true
      key_password:
        description: 'Key password (remember this!)'
        required: true
      key_alias:
        description: 'Key alias'
        required: true
        default: 'androidkey'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Anirban, OU=Dev, O=MathPhysicsLab, L=City, S=State, C=IN"

      - name: Base64 encode
        run: base64 -w 0 android.keystore > keystore.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            android.keystore
            keystore.base64.txt
