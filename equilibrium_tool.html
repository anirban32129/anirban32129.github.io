<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Equilibrium Simulator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --stable:   #0077cc;
    --unstable: #cc2200;
    --neutral:  #228800;
  }

  body {
    background: #ffffff;
    font-family: 'EB Garamond', Georgia, serif;
    color: #111;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  #bg-glow {
    position: fixed; inset: 0; pointer-events: none;
    transition: background 1s ease; z-index: 0;
  }

  /* Header */
  header {
    position: relative; z-index: 10;
    text-align: center;
    padding: 10px 16px 6px;
    flex-shrink: 0;
  }
  header .sub {
    font-size: 9px; letter-spacing: 5px; color: #00000066;
    text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
  }
  header h1 { font-size: clamp(18px, 3vw, 26px); font-weight: 400; color: #111; }
  header h1 span { font-style: italic; transition: color 0.5s; }

  /* Tabs */
  .tabs {
    display: flex; gap: 8px; z-index: 10; position: relative;
    margin-bottom: 6px; flex-shrink: 0;
  }
  .tab {
    background: transparent; border-radius: 7px;
    padding: 5px 16px; font-size: 12px; cursor: pointer;
    font-family: 'EB Garamond', serif; letter-spacing: 0.5px;
    transition: all 0.3s; border: 1.5px solid #00000022; color: #00000066;
  }
  .tab.active { font-weight: 600; }

  /* 3D canvas */
  #three-wrap {
    position: relative; z-index: 5;
    width: 100%; flex: 1;
    min-height: 0;
  }
  #three-canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  /* Overlay panels */
  #info-overlay {
    position: absolute; top: 10px; left: 12px;
    background: rgba(255,255,255,0.92);
    border-radius: 12px; padding: 12px 16px;
    border: 1px solid rgba(0,0,0,0.12);
    max-width: 200px; z-index: 20;
    backdrop-filter: blur(8px);
  }
  #info-overlay .type-name {
    font-size: 14px; font-style: italic; margin-bottom: 4px;
    transition: color 0.5s;
  }
  #info-overlay .cond {
    font-size: 13px; font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px; opacity: 0.85; color: #111;
  }
  #info-overlay .row {
    font-size: 11px; color: #333; margin-bottom: 3px;
    padding-left: 8px; border-left: 2px solid transparent;
    transition: border-color 0.5s;
  }

  #status-overlay {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    border-radius: 20px; padding: 7px 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 1px; z-index: 20; color: #111;
    border: 1.5px solid transparent;
    transition: all 0.4s; white-space: nowrap;
    backdrop-filter: blur(8px);
  }

  /* Force meter */
  #force-overlay {
    position: absolute; top: 10px; right: 12px;
    background: rgba(255,255,255,0.92);
    border-radius: 12px; padding: 12px 14px;
    border: 1px solid rgba(0,0,0,0.12);
    width: 172px; z-index: 20;
    backdrop-filter: blur(8px);
  }
  #force-overlay .flbl {
    font-size: 9px; color: #00000066; letter-spacing: 2px;
    text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
  }
  .fbar-track {
    height: 8px; background: #00000012; border-radius: 4px;
    overflow: hidden; margin-bottom: 4px;
  }
  .fbar-fill { height: 100%; border-radius: 4px; width: 0%; transition: width 0.05s, background 0.5s; }
  .fbar-label { font-size: 10px; color: #555; font-family: 'JetBrains Mono', monospace; }

  #force-overlay .dir-lbl {
    font-size: 11px; margin-top: 6px; color: #333;
    font-family: 'JetBrains Mono', monospace;
    transition: color 0.5s;
  }
  .graph-sep {
    height: 1px; background: #00000018; margin: 10px 0 0;
  }
  #d2u-badge {
    margin-top: 7px;
    background: #00000006;
    border-radius: 7px;
    padding: 6px 8px;
    text-align: center;
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.5px;
    border: 1px solid transparent;
    transition: color 0.5s, border-color 0.5s;
  }
  #d2u-badge .d2u-main {
    font-size: 15px; font-weight: 600; color: #111;
  }
  #d2u-badge .d2u-meaning {
    font-size: 10px; margin-top: 3px; opacity: 0.65; color: #333;
    font-family: 'JetBrains Mono', monospace;
    font-style: normal; letter-spacing: 1px;
  }

  /* Hint */
  #hint-badge {
    position: absolute; bottom: 46px; right: 12px;
    background: rgba(255,255,255,0.85);
    border-radius: 8px; padding: 6px 10px;
    font-size: 10px; color: #00000066; z-index: 20;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.5px; text-align: center;
    backdrop-filter: blur(6px);
    border: 1px solid #00000015;
  }

  /* Bottom dots */
  .dots {
    position: relative; z-index: 10;
    display: flex; gap: 8px; align-items: center;
    padding-bottom: 8px; flex-shrink: 0;
  }
  .dot { height: 6px; border-radius: 3px; background: #00000022; transition: all 0.4s; width: 6px; }
  .dot.active { width: 22px; }

  /* ── Hide/Show toggle tab ── */
  #toggle-btn {
    position: fixed;
    bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 9px 28px;
    font-size: 13px;
    font-family: 'EB Garamond', Georgia, serif;
    letter-spacing: 1.5px;
    cursor: pointer;
    box-shadow: 0 3px 16px #00000033;
    transition: background 0.25s, transform 0.15s;
    user-select: none;
  }
  #toggle-btn:hover { background: #333; transform: translateX(-50%) scale(1.04); }
  #toggle-btn:active { transform: translateX(-50%) scale(0.97); }

  /* Smooth transition for all panels */
  header, .tabs, .dots,
  #info-overlay, #force-overlay, #status-overlay, #hint-badge {
    transition: opacity 0.35s ease;
  }

  /* Hidden state */
  body.panels-hidden header,
  body.panels-hidden .tabs,
  body.panels-hidden .dots,
  body.panels-hidden #surface-btn,
  body.panels-hidden #info-overlay,
  body.panels-hidden #force-overlay,
  body.panels-hidden #status-overlay,
  body.panels-hidden #hint-badge {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* Toggle btn changes when hidden */
  body.panels-hidden #toggle-btn {
    background: #0077cc;
  }
</style>
</head>
<body>
<a href="index.html" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(10,12,18,0.85);color:#ffb92e;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.5px;text-decoration:none;padding:7px 12px;border:1px solid rgba(255,185,46,0.4);border-radius:8px;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,0.35);">&larr; Home</a>


<div id="bg-glow"></div>

<header>
  <div class="sub">Physics · Laws of Motion · 3D Simulation</div>
  <h1>Types of <span id="title-word">Equilibrium</span></h1>
</header>

<div class="tabs" id="tabs"></div>
<div style="position:relative;z-index:10;margin-bottom:6px;">
  <button id="surface-btn" style="
    background: #111; color: #fff; border: none; border-radius: 20px;
    padding: 6px 20px; font-size: 12px; font-family: 'EB Garamond', serif;
    letter-spacing: 1px; cursor: pointer; box-shadow: 0 2px 10px #00000022;
    transition: background 0.25s;
  ">🫙 Hide Surface</button>
</div>

<div id="three-wrap">
  <canvas id="three-canvas"></canvas>

  <!-- Info panel -->
  <div id="info-overlay">
    <div class="type-name" id="ov-name"></div>
    <div class="cond" id="ov-cond"></div>
    <div class="row" id="ov-e" style="margin-bottom:4px"></div>
    <div class="row" id="ov-cg"></div>
    <div class="row" id="ov-res" style="margin-top:6px;font-style:italic;color:#ffffffcc"></div>
  </div>

  <!-- Force overlay -->
  <div id="force-overlay">
    <div class="flbl">Force Meter</div>
    <div class="fbar-track"><div class="fbar-fill" id="fbar"></div></div>
    <div class="fbar-label" id="fbar-lbl">0.0</div>
    <div class="dir-lbl" id="fdir-lbl">—</div>

    <!-- U vs r Energy Graph -->
    <div class="graph-sep"></div>
    <div class="flbl" style="margin-top:10px;">ENERGY GRAPH  U vs r</div>
    <div style="position:relative;">
      <canvas id="energy-graph" width="148" height="110" style="display:block;width:100%;border-radius:6px;background:#f4f4f4;border:1px solid #00000012;"></canvas>
    </div>
    <!-- d²U/dr² condition badge -->
    <div id="d2u-badge"></div>
  </div>

  <!-- Status -->
  <div id="status-overlay">● Equilibrium — drag the ball</div>

  <!-- Hint -->
  <div id="hint-badge">☝ drag ball · swipe to rotate<br>🤏 pinch to zoom</div>
</div>

<div class="dots" id="dots"></div>

<!-- Toggle panels button — must be in DOM before the script runs -->
<button id="toggle-btn">👁 Hide Panels</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var surfaceVisible = true; // declared first so toggleSurface can always access it

// ── Type data ────────────────────────────────────────────────────
const TYPES = [
  {
    id: 'stable', label: 'Stable Equilibrium', icon: '↩',
    color: '#0077cc', colorHex: 0x0077cc,
    condition: 'd²U/dr² = +ve',
    energy: 'Potential Energy → MINIMUM',
    cg: 'Centre of Gravity → LOWEST',
    result: 'Ball returns to centre ↩',
    forceType: 'restoring',
    surfaceFn: (x, z) => { const r2 = x*x + z*z; return 0.22 * r2 - 1.4; },
    ballStart: { x: 0, z: 0 },
  },
  {
    id: 'unstable', label: 'Unstable Equilibrium', icon: '↗',
    color: '#cc2200', colorHex: 0xcc2200,
    condition: 'd²U/dr² = −ve',
    energy: 'Potential Energy → MAXIMUM',
    cg: 'Centre of Gravity → HIGHEST',
    result: 'Ball flies away ↗',
    forceType: 'repulsive',
    surfaceFn: (x, z) => { const r2 = x*x + z*z; return -0.22 * r2 + 1.4; },
    ballStart: { x: 0, z: 0 },
  },
  {
    id: 'neutral', label: 'Neutral Equilibrium', icon: '→',
    color: '#228800', colorHex: 0x228800,
    condition: 'd²U/dr² = 0',
    energy: 'Potential Energy → CONSTANT',
    cg: 'Centre of Gravity → SAME HEIGHT',
    result: 'Ball stays wherever placed →',
    forceType: 'none',
    surfaceFn: (x, z) => 0.06,
    ballStart: { x: 0, z: 0 },
  },
];

let current = 0;
let T = TYPES[0];

// ── Three.js setup ───────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const wrap = document.getElementById('three-wrap');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0xffffff, 1);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(0, 6, 11);
camera.lookAt(0, 0, 0);

// Resize
function resizeRenderer() {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

// ── Lighting ─────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-4, 6, -5);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0x0077cc, 0.6, 20);
pointLight.position.set(0, 4, 0);
scene.add(pointLight);

// ── Scene objects ─────────────────────────────────────────────────
let surfaceMesh = null;
let ballMesh = null;
let fixedBalls = [];
let bondLines = [];
let gridHelper = null;
let glowSprite = null;

// Grid
function makeGrid() {
  if (gridHelper) scene.remove(gridHelper);
  gridHelper = new THREE.GridHelper(12, 24, 0xbbbbbb, 0xdddddd);
  gridHelper.position.y = -2.0;
  scene.add(gridHelper);
}
makeGrid();

// Surface geometry — proper 3D shapes per type
function makeSurface(type) {
  // Remove old
  if (surfaceMesh) {
    surfaceMesh.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
    scene.remove(surfaceMesh);
  }

  const col = type.colorHex;
  const mat = new THREE.MeshPhongMaterial({
    color: col, emissive: col, emissiveIntensity: 0.05,
    transparent: true, opacity: 0.55,
    side: THREE.DoubleSide, shininess: 60,
  });
  const wireMat = new THREE.MeshBasicMaterial({
    color: col, wireframe: true, transparent: true, opacity: 0.22,
  });

  let geo;

  if (type.id === 'stable') {
    // ── BOWL using LatheGeometry ──────────────────────────────────
    // Profile curve: y = a*r^2  (parabola)  from r=0 to r=3.5
    const points = [];
    const steps = 40;
    for (let i = 0; i <= steps; i++) {
      const r = (i / steps) * 3.5;          // radius 0 → 3.5
      const y = 0.22 * r * r - 1.4;         // parabola, bottom at y=-1.4
      points.push(new THREE.Vector2(r, y));
    }
    geo = new THREE.LatheGeometry(points, 64);
    // Bowl sits so its rim is ~y=1.3, bottom at y=-1.4
    surfaceMesh = new THREE.Mesh(geo, mat);
    // Add inner wireframe
    const wire = new THREE.Mesh(geo.clone(), wireMat);
    surfaceMesh.add(wire);
    // Thin base disc so it doesn't look open-bottomed
    const baseGeo = new THREE.CircleGeometry(0.15, 32);
    baseGeo.rotateX(-Math.PI / 2);
    const base = new THREE.Mesh(baseGeo, mat.clone());
    base.position.y = -1.4;
    surfaceMesh.add(base);

  } else if (type.id === 'unstable') {
    // ── HILL / INVERTED CONE with rounded top ─────────────────────
    // Profile: y = -0.22*r^2 + 1.4  (inverted parabola)
    const points = [];
    const steps = 40;
    for (let i = 0; i <= steps; i++) {
      const r = (i / steps) * 3.5;
      const y = -0.22 * r * r + 1.4;
      points.push(new THREE.Vector2(r, y));
    }
    geo = new THREE.LatheGeometry(points, 64);
    surfaceMesh = new THREE.Mesh(geo, mat);
    const wire = new THREE.Mesh(geo.clone(), wireMat);
    surfaceMesh.add(wire);

  } else {
    // ── FLAT DISC ─────────────────────────────────────────────────
    geo = new THREE.CylinderGeometry(3.5, 3.5, 0.12, 64);
    surfaceMesh = new THREE.Mesh(geo, mat);
    surfaceMesh.position.y = -0.06;
    const wire = new THREE.Mesh(geo.clone(), wireMat);
    surfaceMesh.add(wire);
  }

  surfaceMesh.receiveShadow = true;
  scene.add(surfaceMesh);
}

function hexToRgb(hex) {
  return [(hex >> 16 & 255) / 255, (hex >> 8 & 255) / 255, (hex & 255) / 255];
}

// Ball
function makeBall(type) {
  if (ballMesh) { scene.remove(ballMesh); }

  const geo = new THREE.SphereGeometry(0.32, 32, 32);
  const mat = new THREE.MeshPhongMaterial({
    color: type.colorHex,
    emissive: type.colorHex,
    emissiveIntensity: 0.15,
    shininess: 90,
    specular: 0x444444,
  });
  ballMesh = new THREE.Mesh(geo, mat);
  ballMesh.castShadow = true;

  const y = type.surfaceFn(0, 0) + 0.33;
  ballMesh.position.set(0, y, 0);
  scene.add(ballMesh);
}

// ── Trail ─────────────────────────────────────────────────────────
let trailPoints = [];
let trailLine = null;
const TRAIL_MAX = 120;

function updateTrail() {
  if (!ballMesh || sim.gone) return;
  const p = ballMesh.position.clone();
  trailPoints.push(p);
  if (trailPoints.length > TRAIL_MAX) trailPoints.shift();

  if (trailLine) scene.remove(trailLine);
  if (trailPoints.length < 2) return;

  const geo = new THREE.BufferGeometry().setFromPoints(trailPoints);
  // Build per-point alpha (fade from old to new)
  const colors = [];
  for (let i = 0; i < trailPoints.length; i++) {
    const a = i / (trailPoints.length - 1);
    colors.push(a * 0.15, a * 0.15, a * 0.15); // dark grey → black
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    linewidth: 2,
  });
  trailLine = new THREE.Line(geo, mat);
  scene.add(trailLine);
}

function clearTrail() {
  trailPoints = [];
  if (trailLine) { scene.remove(trailLine); trailLine = null; }
}

// Fixed particles (left & right)
function makeFixedBalls(type) {
  fixedBalls.forEach(b => scene.remove(b));
  fixedBalls = [];
  bondLines.forEach(l => scene.remove(l));
  bondLines = [];

  const positions = [[-2.8, 0, 0], [2.8, 0, 0]];
  positions.forEach(([fx, fy, fz]) => {
    const geo = new THREE.SphereGeometry(0.28, 24, 24);
    const mat = new THREE.MeshPhongMaterial({
      color: type.colorHex,
      emissive: type.colorHex,
      emissiveIntensity: 0.25,
      transparent: true, opacity: 0.7,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(fx, type.surfaceFn(fx, fz) + 0.29, fz);
    scene.add(mesh);
    fixedBalls.push(mesh);
  });

  updateBondLines();
}

function updateBondLines() {
  bondLines.forEach(l => scene.remove(l));
  bondLines = [];
  if (!ballMesh || fixedBalls.length < 2) return;

  fixedBalls.forEach(fb => {
    const start = fb.position.clone();
    const end = ballMesh.position.clone();
    const dir = end.clone().sub(start);
    const len = dir.length();
    dir.normalize();

    // shrink so it doesn't overlap spheres
    const s = start.clone().addScaledVector(dir, 0.3);
    const e = end.clone().addScaledVector(dir, -0.34);

    const geo = new THREE.BufferGeometry().setFromPoints([s, e]);
    const mat = new THREE.LineBasicMaterial({
      color: 0x222222, transparent: true,
      opacity: sim.gone ? 0.15 : 0.6,
    });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    bondLines.push(line);
  });
}

// Glow point light follows ball
function updateGlow() {
  if (!ballMesh) return;
  pointLight.color.setHex(T.colorHex);
  pointLight.position.copy(ballMesh.position).add(new THREE.Vector3(0, 1.5, 0));
}

// ── Physics state ─────────────────────────────────────────────────
const sim = {
  x: 0, z: 0,       // displacement
  vx: 0, vz: 0,
  dragging: false,
  gone: false,
};

const K_RESTORE = 0.016;
const K_REPEL = 0.020;
const DAMP = 0.968;
const MAX_DIST = 5.0;

function updatePhysics() {
  if (sim.dragging || sim.gone) return;
  const dist = Math.sqrt(sim.x * sim.x + sim.z * sim.z);

  if (T.forceType === 'restoring') {
    sim.vx += -K_RESTORE * sim.x;
    sim.vz += -K_RESTORE * sim.z;
    sim.vx *= DAMP; sim.vz *= DAMP;
    sim.x += sim.vx; sim.z += sim.vz;
    if (dist < 0.01 && Math.abs(sim.vx) < 0.01 && Math.abs(sim.vz) < 0.01) {
      sim.x = 0; sim.z = 0; sim.vx = 0; sim.vz = 0;
    }
  } else if (T.forceType === 'repulsive') {
    if (dist > 0.05) {
      sim.vx += K_REPEL * sim.x;
      sim.vz += K_REPEL * sim.z;
      sim.x += sim.vx; sim.z += sim.vz;
      if (Math.sqrt(sim.x * sim.x + sim.z * sim.z) > MAX_DIST) {
        sim.gone = true;
      }
    }
  }
  // neutral: no force
}

function applySimToBall() {
  if (!ballMesh) return;
  if (sim.gone) {
    // fade ball out
    ballMesh.material.opacity = Math.max(0, ballMesh.material.opacity - 0.02);
    ballMesh.material.transparent = true;
    ballMesh.position.x = sim.x;
    ballMesh.position.z = sim.z;
    ballMesh.position.y = T.surfaceFn(sim.x, sim.z) + 0.33;
    return;
  }
  ballMesh.position.x = sim.x;
  ballMesh.position.z = sim.z;
  ballMesh.position.y = T.surfaceFn(sim.x, sim.z) + 0.33;
  ballMesh.material.opacity = 1;
}

// ── Orbit controls (manual) ───────────────────────────────────────
const orbitState = {
  active: false, right: false,
  lastX: 0, lastY: 0,
  theta: 0.3, phi: 0.52, radius: 12.5,
};

function orbitUpdate() {
  const x = orbitState.radius * Math.sin(orbitState.phi) * Math.sin(orbitState.theta);
  const y = orbitState.radius * Math.cos(orbitState.phi);
  const z = orbitState.radius * Math.sin(orbitState.phi) * Math.cos(orbitState.theta);
  camera.position.set(x, y, z);
  camera.lookAt(0, 0, 0);
}
orbitUpdate();

// ── Raycasting for drag ───────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function getPointerNDC(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: ((clientX - rect.left) / rect.width) * 2 - 1,
    y: -((clientY - rect.top) / rect.height) * 2 + 1,
  };
}

function isOnBall(ndc) {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(ballMesh);
  return hits.length > 0;
}

function getDragPoint(ndc) {
  raycaster.setFromCamera(ndc, camera);
  const target = new THREE.Vector3();
  // adjust plane to ball height
  const planeY = ballMesh ? ballMesh.position.y - 0.3 : 0;
  dragPlane.constant = -planeY;
  if (raycaster.ray.intersectPlane(dragPlane, target)) return target;
  return null;
}

// ── Pointer events ─────────────────────────────────────────────────
let pointerDownOnBall = false;
let rightDrag = false;

canvas.addEventListener('mousedown', e => {
  if (sim.gone) return;
  if (e.button === 2) { rightDrag = true; orbitState.lastX = e.clientX; orbitState.lastY = e.clientY; return; }
  const ndc = getPointerNDC(e);
  if (isOnBall(ndc)) {
    sim.dragging = true; pointerDownOnBall = true;
    sim.vx = 0; sim.vz = 0;
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('mousemove', e => {
  if (rightDrag) {
    const dx = e.clientX - orbitState.lastX;
    const dy = e.clientY - orbitState.lastY;
    orbitState.theta -= dx * 0.008;
    orbitState.phi = Math.max(0.15, Math.min(1.4, orbitState.phi + dy * 0.008));
    orbitState.lastX = e.clientX; orbitState.lastY = e.clientY;
    orbitUpdate(); return;
  }
  if (!sim.dragging) return;
  const ndc = getPointerNDC(e);
  const pt = getDragPoint(ndc);
  if (pt) {
    sim.x = Math.max(-MAX_DIST * 0.9, Math.min(MAX_DIST * 0.9, pt.x));
    sim.z = Math.max(-MAX_DIST * 0.9, Math.min(MAX_DIST * 0.9, pt.z));
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 2) { rightDrag = false; return; }
  sim.dragging = false; pointerDownOnBall = false;
  canvas.style.cursor = 'grab';
  if (T.forceType === 'none') { sim.vx = 0; sim.vz = 0; }
});

// ── Touch controls ─────────────────────────────────────────────────
// Logic:
//   • 1 finger on ball   → drag the ball
//   • 1 finger elsewhere → rotate camera
//   • 2 fingers          → pinch to zoom

let touchRotating = false;
let lastTouchX = 0, lastTouchY = 0;
let lastPinchDist = 0;

function getTouchNDC(touch) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((touch.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((touch.clientY - rect.top) / rect.height) * 2 + 1,
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();

  if (e.touches.length === 2) {
    // Two fingers — start pinch zoom
    sim.dragging = false;
    touchRotating = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastPinchDist = Math.sqrt(dx * dx + dy * dy);
    return;
  }

  // One finger
  if (sim.gone) return;
  const touch = e.touches[0];
  const ndc = getTouchNDC(touch);

  if (isOnBall(ndc)) {
    // Finger is on the ball — drag it
    sim.dragging = true;
    touchRotating = false;
    sim.vx = 0; sim.vz = 0;
  } else {
    // Finger elsewhere — rotate camera
    touchRotating = true;
    sim.dragging = false;
    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();

  if (e.touches.length === 2) {
    // Pinch zoom
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const delta = lastPinchDist - dist;
    orbitState.radius = Math.max(4, Math.min(20, orbitState.radius + delta * 0.04));
    lastPinchDist = dist;
    orbitUpdate();
    return;
  }

  const touch = e.touches[0];

  if (sim.dragging) {
    // Move ball
    const ndc = getTouchNDC(touch);
    const pt = getDragPoint(ndc);
    if (pt) {
      sim.x = Math.max(-MAX_DIST * 0.9, Math.min(MAX_DIST * 0.9, pt.x));
      sim.z = Math.max(-MAX_DIST * 0.9, Math.min(MAX_DIST * 0.9, pt.z));
    }
    return;
  }

  if (touchRotating) {
    // Rotate camera
    const dx = touch.clientX - lastTouchX;
    const dy = touch.clientY - lastTouchY;
    orbitState.theta -= dx * 0.008;
    orbitState.phi = Math.max(0.12, Math.min(1.45, orbitState.phi + dy * 0.008));
    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    orbitUpdate();
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (e.touches.length === 0) {
    // All fingers lifted
    if (sim.dragging && T.forceType === 'none') { sim.vx = 0; sim.vz = 0; }
    sim.dragging = false;
    touchRotating = false;
  } else if (e.touches.length === 1 && !sim.dragging) {
    // Went from 2 fingers to 1 — start rotating with remaining finger
    touchRotating = true;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
}, { passive: false });

// Scroll zoom
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbitState.radius = Math.max(4, Math.min(18, orbitState.radius + e.deltaY * 0.02));
  orbitUpdate();
}, { passive: false });

// cursor hover
canvas.addEventListener('mousemove', e => {
  if (sim.dragging || sim.gone) return;
  const ndc = getPointerNDC(e);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(ballMesh);
  canvas.style.cursor = hits.length > 0 ? 'grab' : 'default';
});

// ── UI updates ────────────────────────────────────────────────────
function updateUI() {
  const col = T.color;
  const dist = Math.sqrt(sim.x * sim.x + sim.z * sim.z);
  const normDisp = Math.min(1, dist / 3.5);

  // Force bar
  let forceAmt = 0, forceLbl = '0.0', dirLbl = '—';
  if (T.forceType === 'restoring') {
    forceAmt = normDisp;
    forceLbl = (normDisp * 10).toFixed(1) + ' N';
    dirLbl = dist > 0.1 ? '← restoring' : '● at rest';
  } else if (T.forceType === 'repulsive') {
    forceAmt = normDisp;
    forceLbl = sim.gone ? 'MAX — escaped' : (normDisp * 10).toFixed(1) + ' N';
    dirLbl = sim.gone ? '↗ escaped!' : (dist > 0.1 ? '↗ repulsive' : '● unstable');
  } else {
    forceAmt = 0; forceLbl = '0.0 N'; dirLbl = '→ no force';
  }

  document.getElementById('fbar').style.width = (forceAmt * 100) + '%';
  document.getElementById('fbar').style.background = T.color;
  document.getElementById('fbar-lbl').textContent = forceLbl;
  document.getElementById('fbar-lbl').style.color = '#333';
  document.getElementById('fdir-lbl').textContent = dirLbl;
  document.getElementById('fdir-lbl').style.color = '#111';

  // Status
  const statusEl = document.getElementById('status-overlay');
  let statusText;
  if (sim.dragging) {
    statusText = T.forceType === 'restoring' ? '⟵ Restoring force opposes displacement' :
                 T.forceType === 'repulsive' ? '↗ Repulsive force — will escape on release!' :
                 '→ No force — neutral equilibrium';
  } else if (sim.gone) {
    statusText = '↗ Ball escaped! Unstable equilibrium confirmed.';
  } else if (dist < 0.08) {
    statusText = '● At equilibrium — grab the glowing ball to push it';
  } else if (T.forceType === 'restoring') {
    statusText = '↩ Returning to equilibrium...';
  } else if (T.forceType === 'none') {
    statusText = `→ Ball stays at displaced position (x=${sim.x.toFixed(1)}, z=${sim.z.toFixed(1)})`;
  } else {
    statusText = '↗ Ball flying away...';
  }
  statusEl.textContent = statusText;
  statusEl.style.color = '#111';
  statusEl.style.borderColor = T.color;
  statusEl.style.background = 'rgba(255,255,255,0.95)';
}

// ── Energy Graph (U vs r) ─────────────────────────────────────────
const egCanvas = document.getElementById('energy-graph');
const egCtx = egCanvas.getContext('2d');

function drawEnergyGraph() {
  const W = egCanvas.width, H = egCanvas.height;
  const col = T.color;
  egCtx.clearRect(0, 0, W, H);

  // Current ball radius from centre
  const ballR = Math.sqrt(sim.x * sim.x + sim.z * sim.z);
  const maxR = 4.5; // world units mapped to graph

  // U(r) functions per type
  // Stable:   U = +k*r²  (bowl — parabola up)
  // Unstable: U = -k*r²  (hill — parabola down)
  // Neutral:  U = const
  const K_GRAPH = 0.22;
  function Ufn(r) {
    if (T.id === 'stable')   return  K_GRAPH * r * r;
    if (T.id === 'unstable') return -K_GRAPH * r * r;
    return 0;
  }

  // Map r → canvas x,  U → canvas y
  // r range: -maxR to +maxR (symmetric)
  // U range determined per type
  const uMin = T.id === 'stable'   ?  0       : T.id === 'unstable' ? -K_GRAPH * maxR * maxR : -0.5;
  const uMax = T.id === 'stable'   ?  K_GRAPH * maxR * maxR : T.id === 'unstable' ? 0 : 0.5;
  const uRange = uMax - uMin || 1;

  const PAD_L = 28, PAD_R = 10, PAD_T = 10, PAD_B = 22;
  const gW = W - PAD_L - PAD_R;
  const gH = H - PAD_T - PAD_B;

  function rx(r) { return PAD_L + ((r + maxR) / (2 * maxR)) * gW; }
  function uy(u) { return PAD_T + (1 - (u - uMin) / uRange) * gH; }

  // ── Draw curve fill ──
  egCtx.beginPath();
  for (let i = 0; i <= 100; i++) {
    const r = -maxR + (i / 100) * 2 * maxR;
    const u = Ufn(r);
    if (i === 0) egCtx.moveTo(rx(r), uy(u));
    else egCtx.lineTo(rx(r), uy(u));
  }
  // close fill to baseline
  const baselineU = T.id === 'stable' ? uMin : T.id === 'unstable' ? uMin : 0;
  egCtx.lineTo(rx(maxR), uy(baselineU));
  egCtx.lineTo(rx(-maxR), uy(baselineU));
  egCtx.closePath();
  const fillGrad = egCtx.createLinearGradient(0, PAD_T, 0, PAD_T + gH);
  fillGrad.addColorStop(0, col + '33');
  fillGrad.addColorStop(1, col + '06');
  egCtx.fillStyle = fillGrad;
  egCtx.fill();

  // ── Draw curve line ──
  egCtx.beginPath();
  for (let i = 0; i <= 100; i++) {
    const r = -maxR + (i / 100) * 2 * maxR;
    const u = Ufn(r);
    if (i === 0) egCtx.moveTo(rx(r), uy(u));
    else egCtx.lineTo(rx(r), uy(u));
  }
  egCtx.strokeStyle = col;
  egCtx.lineWidth = 2.2;
  egCtx.shadowColor = col;
  egCtx.shadowBlur = 6;
  egCtx.stroke();
  egCtx.shadowBlur = 0;

  // ── Axes ──
  egCtx.strokeStyle = 'rgba(0,0,0,0.35)';
  egCtx.lineWidth = 1;
  // x-axis at U=0 or bottom
  const axisY = uy(T.id === 'neutral' ? 0 : uMin);
  egCtx.beginPath(); egCtx.moveTo(PAD_L, axisY); egCtx.lineTo(W - PAD_R, axisY); egCtx.stroke();
  // y-axis at r=0
  const axisX = rx(0);
  egCtx.beginPath(); egCtx.moveTo(axisX, PAD_T); egCtx.lineTo(axisX, PAD_T + gH); egCtx.stroke();

  // ── Axis labels ──
  egCtx.fillStyle = 'rgba(0,0,0,0.55)';
  egCtx.font = 'italic 10px Georgia, serif';
  egCtx.textAlign = 'right';
  egCtx.fillText('U', PAD_L - 3, PAD_T + 8);
  egCtx.textAlign = 'center';
  egCtx.fillText('r', W - PAD_R, axisY + 10);
  egCtx.fillText('r₀', axisX, PAD_T + gH + 14);

  // ── r₀ dashed vertical ──
  egCtx.setLineDash([3, 3]);
  egCtx.strokeStyle = col + 'aa';
  egCtx.lineWidth = 1;
  egCtx.beginPath(); egCtx.moveTo(axisX, PAD_T); egCtx.lineTo(axisX, PAD_T + gH); egCtx.stroke();
  egCtx.setLineDash([]);

  // ── Ball dot tracking on curve ──
  // Map signed displacement to r (use magnitude for symmetric curve, but show sign as position)
  const signedR = sim.gone ? (sim.x > 0 ? maxR : -maxR) : sim.x; // use x as signed r
  const clampedR = Math.max(-maxR, Math.min(maxR, signedR));
  const ballU = Ufn(clampedR);
  const dotX = rx(clampedR);
  const dotY = uy(ballU);

  // Vertical drop line from dot to x-axis
  egCtx.setLineDash([2, 3]);
  egCtx.strokeStyle = col + '44';
  egCtx.lineWidth = 1;
  egCtx.beginPath(); egCtx.moveTo(dotX, dotY); egCtx.lineTo(dotX, axisY); egCtx.stroke();
  egCtx.setLineDash([]);

  // Dot
  egCtx.beginPath(); egCtx.arc(dotX, dotY, 5.5, 0, Math.PI * 2);
  egCtx.fillStyle = col;
  egCtx.shadowColor = col; egCtx.shadowBlur = 10;
  egCtx.fill(); egCtx.shadowBlur = 0;
  egCtx.beginPath(); egCtx.arc(dotX, dotY, 2, 0, Math.PI * 2);
  egCtx.fillStyle = '#fff'; egCtx.fill();

  // ── d²U/dr² annotation on curve ──
  egCtx.fillStyle = '#111';
  egCtx.font = 'bold 9px JetBrains Mono, monospace';
  egCtx.textAlign = 'center';
  const annText = T.id === 'stable' ? 'd²U/dr²= +ve' : T.id === 'unstable' ? 'd²U/dr²= −ve' : 'd²U/dr²= 0';
  egCtx.fillText(annText, W / 2, H - 4);

  // ── Update d²U badge ──
  const badge = document.getElementById('d2u-badge');
  const val = T.id === 'stable' ? '+ve' : T.id === 'unstable' ? '−ve' : '0';
  const meaning = T.id === 'stable' ? 'U is MINIMUM' : T.id === 'unstable' ? 'U is MAXIMUM' : 'U is CONSTANT';
  badge.innerHTML = `
    <div class="d2u-main" style="color:#111;">d²U/dr² = <span style="color:${T.color};font-weight:800;">${val}</span></div>
    <div class="d2u-meaning" style="color:#333;">${meaning}</div>
  `;
  badge.style.borderColor = T.color + '66';
}

// ── Build UI ──────────────────────────────────────────────────────
function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  TYPES.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === current ? ' active' : '');
    btn.style.color = '#111';
    btn.style.borderColor = i === current ? t.color : '#00000022';
    btn.style.background = i === current ? t.color + '18' : 'transparent';
    btn.style.fontWeight = i === current ? '700' : '400';
    btn.textContent = t.icon + ' ' + t.label.split(' ')[0];
    btn.addEventListener('click', () => selectType(i));
    el.appendChild(btn);
  });
}

function buildDots() {
  const el = document.getElementById('dots');
  el.innerHTML = '';
  TYPES.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.style.background = i === current ? t.color : '#00000022';
    el.appendChild(d);
  });
}

function applyTheme() {
  const col = T.color;
  document.getElementById('bg-glow').style.background = 'none';
  // Title word — black
  document.getElementById('title-word').style.color = '#111';
  // Info overlay — all black text, colored left-border accent only
  document.getElementById('ov-name').textContent = T.label;
  document.getElementById('ov-name').style.color = '#111';
  document.getElementById('ov-cond').textContent = T.condition;
  document.getElementById('ov-cond').style.color = '#111';
  document.getElementById('ov-e').textContent = T.energy;
  document.getElementById('ov-e').style.borderLeftColor = col;
  document.getElementById('ov-e').style.color = '#222';
  document.getElementById('ov-cg').textContent = T.cg;
  document.getElementById('ov-cg').style.borderLeftColor = col;
  document.getElementById('ov-cg').style.color = '#222';
  document.getElementById('ov-res').textContent = T.result;
  document.getElementById('ov-res').style.color = '#111';
  document.getElementById('ov-res').style.fontWeight = '600';
}

function selectType(i) {
  current = i; T = TYPES[i];
  sim.x = 0; sim.z = 0; sim.vx = 0; sim.vz = 0; sim.dragging = false; sim.gone = false;
  clearTrail();

  // Rebuild 3D
  makeSurface(T);
  if (surfaceMesh) surfaceMesh.visible = surfaceVisible;
  makeBall(T);
  makeFixedBalls(T);
  pointLight.color.setHex(T.colorHex);

  applyTheme();
  buildTabs();
  buildDots();
}

// ── Init scene ────────────────────────────────────────────────────
selectType(0);

// ── Render loop ───────────────────────────────────────────────────
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  updatePhysics();
  applySimToBall();
  updateTrail();
  updateBondLines();
  updateGlow();
  updateUI();
  drawEnergyGraph();

  // Subtle ball pulse
  if (ballMesh && !sim.gone) {
    const pulse = 1 + 0.04 * Math.sin(time * 3);
    ballMesh.scale.set(pulse, pulse, pulse);
    // Ball emissive throb
    ballMesh.material.emissiveIntensity = 0.35 + 0.15 * Math.sin(time * 2.5);
  }

  // Surface subtle wave for stable (bowl)
  if (surfaceMesh && T.id === 'stable') {
    surfaceMesh.material.emissiveIntensity = 0.06 + 0.03 * Math.sin(time * 1.5);
  }

  renderer.render(scene, camera);
}
animate();

// ── Toggle functions ───────────────────────────────────────────────

function toggleSurface() {
  surfaceVisible = !surfaceVisible;
  if (surfaceMesh) surfaceMesh.visible = surfaceVisible;
  const btn = document.getElementById('surface-btn');
  btn.textContent = surfaceVisible ? '🫙 Hide Surface' : '🫙 Show Surface';
  btn.style.background = surfaceVisible ? '#111' : '#0077cc';
}

function togglePanels() {
  const hidden = document.body.classList.toggle('panels-hidden');
  document.getElementById('toggle-btn').textContent = hidden ? '👁 Show Panels' : '👁 Hide Panels';
}

// Wire up after DOM + script fully loaded
document.getElementById('surface-btn').addEventListener('click', toggleSurface);
document.getElementById('toggle-btn').addEventListener('click', togglePanels);
</script>
