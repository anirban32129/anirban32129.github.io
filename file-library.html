<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Library — Interactive Math &amp; Physics Lab</title>
<style>
  :root{
    --bg:#05070a; --panel:#12181f; --grid:#1c2530; --text:#e8edf4; --dim:#7c8a9c;
    --torch:#ffb92e; --pink:#ff3d81; --violet:#7c5cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
  header{padding:36px 20px 20px;text-align:center;}
  h1{font-size:26px;margin:0 0 8px;}
  h1 span{color:var(--torch);}
  .sub{color:var(--dim);font-size:13px;max-width:640px;margin:0 auto 20px;line-height:1.6;}
  main{max-width:1080px;margin:0 auto;padding:10px 20px 60px;}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
  #searchBox{flex:2;min-width:200px;padding:13px 14px;border-radius:10px;border:1px solid var(--grid);
    background:var(--panel);color:var(--text);font-size:14px;outline:none;}
  #searchBox:focus{border-color:var(--violet);}
  #categoryFilter{flex:1;min-width:160px;padding:13px 14px;border-radius:10px;border:1px solid var(--grid);
    background:var(--panel);color:var(--text);font-size:14px;outline:none;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .file-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;
    padding:16px;display:flex;flex-direction:column;gap:10px;}
  .file-card:hover{border-color:var(--violet);}
  .fc-top{display:flex;align-items:center;gap:10px;}
  .fc-icon{font-size:26px;}
  .fc-title{font-size:14px;font-weight:600;line-height:1.35;}
  .fc-badge{display:inline-block;font-size:10.5px;letter-spacing:0.3px;color:var(--torch);
    border:1px solid var(--grid);border-radius:5px;padding:2px 7px;margin-top:4px;}
  .fc-desc{font-size:12.5px;color:var(--dim);line-height:1.5;max-height:56px;overflow:hidden;}
  .fc-sub{font-size:11.5px;color:var(--dim);}
  .fc-preview img{width:100%;border-radius:8px;display:block;max-height:150px;object-fit:cover;}
  .fc-preview video, .fc-preview audio{width:100%;border-radius:8px;}
  .fc-actions{display:flex;gap:8px;margin-top:auto;}
  .fc-actions a{flex:1;text-align:center;padding:9px 8px;border-radius:8px;border:1px solid var(--grid);
    color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600;}
  .fc-actions a.primary{background:var(--violet);border-color:var(--violet);color:#fff;}
  .fc-actions a:hover{border-color:var(--violet);}

  #status{text-align:center;color:var(--dim);font-size:13px;padding:40px 0;}
  #noResults{display:none;text-align:center;color:var(--dim);padding:40px 0;}

  footer{text-align:center;color:var(--dim);font-size:11px;padding:30px 20px 50px;}
  footer a{color:var(--torch);text-decoration:none;}
</style>
<link rel="stylesheet" href="ask-question.css">
</head>
<body>

<header>
  <h1>File <span>Library</span></h1>
  <div class="sub">Notes, PDFs, images, videos, and other resources — search or filter by category below.</div>
</header>

<main>
  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search files by title or description...">
    <select id="categoryFilter"><option value="">All Categories</option></select>
  </div>

  <div id="status">Loading files…</div>
  <div id="noResults">No files available yet.</div>
  <div class="grid" id="fileGrid"></div>
</main>

<footer>
  <a href="index.html">&larr; Back to Home</a>
</footer>

<script src="supabase-client.js"></script>
<script src="file-library-common.js"></script>
<script>
(function () {
  const status = document.getElementById("status");
  const noResults = document.getElementById("noResults");
  const grid = document.getElementById("fileGrid");
  const searchBox = document.getElementById("searchBox");
  const categoryFilter = document.getElementById("categoryFilter");

  let allFiles = [];

  async function loadFiles() {
    const supabase = await getSupabase();
    const { data, error } = await supabase
      .from(LIBRARY_TABLE)
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      status.textContent = "Could not load the file library: " + error.message;
      return;
    }

    allFiles = data || [];
    status.style.display = "none";

    if (allFiles.length === 0) {
      noResults.style.display = "block";
      noResults.textContent = "No files available yet.";
      return;
    }

    populateCategoryFilter();
    render();
  }

  function populateCategoryFilter() {
    const cats = Array.from(new Set(allFiles.map((f) => f.category).filter(Boolean))).sort();
    cats.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      categoryFilter.appendChild(opt);
    });
  }

  async function render() {
    const q = searchBox.value.trim().toLowerCase();
    const cat = categoryFilter.value;

    const filtered = allFiles.filter((f) => {
      const matchesQuery =
        !q ||
        (f.title && f.title.toLowerCase().includes(q)) ||
        (f.description && f.description.toLowerCase().includes(q));
      const matchesCategory = !cat || f.category === cat;
      return matchesQuery && matchesCategory;
    });

    grid.innerHTML = "";
    noResults.style.display = filtered.length === 0 ? "block" : "none";
    if (filtered.length === 0) {
      noResults.textContent = allFiles.length === 0 ? "No files available yet." : "No files match your search.";
      return;
    }

    for (const row of filtered) {
      const kind = getFileKind(row.file_type, row.file_name);
      const url = await getLibraryPublicUrl(row.storage_path);

      let preview = "";
      if (kind === "image") {
        preview = `<div class="fc-preview"><img src="${url}" alt="${escapeHtml(row.title)}" loading="lazy"></div>`;
      } else if (kind === "video") {
        preview = `<div class="fc-preview"><video src="${url}" controls preload="metadata"></video></div>`;
      } else if (kind === "audio") {
        preview = `<div class="fc-preview"><audio src="${url}" controls preload="metadata"></audio></div>`;
      }

      const card = document.createElement("div");
      card.className = "file-card";
      card.innerHTML = `
        <div class="fc-top">
          <div class="fc-icon">${getFileIcon(kind)}</div>
          <div>
            <div class="fc-title">${escapeHtml(row.title)}</div>
            <span class="fc-badge">${escapeHtml(row.category || getFileKindLabel(kind))}</span>
          </div>
        </div>
        ${row.description ? `<div class="fc-desc">${escapeHtml(row.description)}</div>` : ""}
        ${preview}
        <div class="fc-sub">${getFileKindLabel(kind)} · ${formatBytes(row.file_size)}</div>
        <div class="fc-actions">
          <a class="primary" href="${url}" target="_blank" rel="noopener">Open</a>
          <a href="${url}" download="${escapeHtml(row.file_name || row.title)}">Download</a>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  searchBox.addEventListener("input", render);
  categoryFilter.addEventListener("change", render);

  loadFiles();
})();
</script>
<script src="ask-question.js"></script>
</body>
</html>
