<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Not Found — Interactive Math &amp; Physics Lab</title>
<style>
  :root{
    --bg:#05070a; --panel:#12181f; --grid:#1c2530; --text:#e8edf4; --dim:#7c8a9c;
    --torch:#ffb92e; --pink:#ff3d81; --violet:#7c5cff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
  a{color:var(--torch);}
  header.page-head{padding:56px 20px 24px;text-align:center;}
  h1{font-size:26px;margin:0 0 10px;letter-spacing:0.5px;}
  h1 span{color:var(--torch);}
  .sub{color:var(--dim);font-size:13px;max-width:640px;margin:0 auto;line-height:1.6;}
  main.content{max-width:760px;margin:0 auto;padding:10px 22px 60px;line-height:1.75;font-size:14.5px;}
  main.content h2{font-size:16px;color:var(--text);margin:34px 0 12px;letter-spacing:0.3px;}
  main.content h3{font-size:14px;color:var(--dim);margin:22px 0 8px;text-transform:uppercase;letter-spacing:0.6px;}
  main.content p{color:#c7d0dc;margin:0 0 14px;}
  main.content ul{color:#c7d0dc;padding-left:20px;margin:0 0 14px;}
  main.content li{margin-bottom:6px;}
  .card-box{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;margin:0 0 18px;}
  .home-badge{position:fixed;top:10px;left:10px;z-index:99999;background:rgba(10,12,18,0.85);color:#ffb92e;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.5px;text-decoration:none;
    padding:7px 12px;border:1px solid rgba(255,185,46,0.4);border-radius:8px;backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(0,0,0,0.35);}
  footer{text-align:center;color:var(--dim);font-size:11px;padding:30px 20px 50px;}
  footer a{color:var(--torch);text-decoration:none;}
  .footer-nav{max-width:700px;margin:0 auto 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
  .footer-nav a{color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:0.3px;}
  .footer-nav a:hover{color:var(--torch);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:6px;}
  .card{display:flex;flex-direction:column;justify-content:space-between;gap:14px;
    background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:16px 18px;
    text-decoration:none;color:var(--text);transition:transform .15s ease, border-color .15s ease;min-height:78px;}
  .card:hover{transform:translateY(-2px);border-color:var(--violet);}
  .card-title{font-size:13.5px;font-weight:600;line-height:1.4;}
  .card-go{font-size:11px;color:var(--torch);letter-spacing:0.5px;}
  .search-wrap{max-width:1080px;margin:0 auto 24px;padding:0 20px;}
  #toolSearch{width:100%;max-width:1080px;padding:14px 16px;border-radius:10px;border:1px solid var(--grid);
    background:var(--panel);color:var(--text);font-size:14px;outline:none;}
  #toolSearch:focus{border-color:var(--violet);}
  #noResults{display:none;text-align:center;color:var(--dim);padding:40px 0;}
  .faq-q{color:var(--text);font-weight:600;font-size:14px;margin:0 0 6px;cursor:pointer;}
  .faq-a{color:#c7d0dc;font-size:13.5px;margin:0 0 20px;line-height:1.7;}
  .center404{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .big404{font-size:80px;font-weight:700;color:var(--pink);margin:0;letter-spacing:2px;}
</style>

</head>
<body class="err">
<a href="index.html" class="home-badge">&larr; Home</a>
<div class="center404">
  <p class="big404">404</p>
  <h1 style="margin:0 0 10px;">Page not <span>found</span></h1>
  <p class="sub" style="margin-bottom:24px;">That page doesn't exist, or the file was renamed. Try the home page or search all tools.</p>
  <div class="footer-nav" style="margin-bottom:0;">
    <a href="index.html">&larr; Back to Home</a>
    <a href="tools.html">Search All Tools</a>
  </div>
</div>
</body>
</html>
